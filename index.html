<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegendOS</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #2b3a4a;
            background-size: cover;
            background-position: center;
        }

        #desktop {
            padding: 15px;
            width: 80px;
        }

        .desktop-imgs {
            text-align: center;
            color: white;
            cursor: pointer;
            padding: 8px 5px;
            margin-bottom: 12px;
            border-radius: 4px;
            font-size: 12px;
        }

        .desktop-imgs:hover {
            background: #ffffff33;
        }

        .desktop-imgs img {
            width: 36px;
            height: 36px;
            display: block;
            margin: 0 auto 4px auto;
        }

        .win {
            position: absolute;
            width: 320px;
            background: white;
            border: 2px solid #222;
            box-shadow: 2px 2px 8px #00000055;
            display: none;
            flex-direction: column;
        }

        .win-title {
            background: #222;
            color: white;
            padding: 6px 10px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .close-btn {
            background: red;
            color: white;
            border: none;
            width: 18px;
            height: 18px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .win-body {
            padding: 12px;
            background: #eee;
            color: #111;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 6px;
            border: 1px solid #999;
            font-size: 13px;
            display: block;
        }

        .settings-group {
            margin-bottom: 10px;
        }

        .settings-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        input[type="text"], 
        input[type="file"] {
            width: 100%;
            padding: 5px;
            border: 1px solid #999;
            margin-bottom: 5px;
            font-size: 12px;
            background: white;
        }

        button.action-btn {
            background: #0066cc;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        button.action-btn:hover {
            background: #004499;
        }

        .color-buttons {
            display: flex;
            gap: 5px;
        }

        .color-btn {
            flex: 1;
            height: 24px;
            border: 1px solid #666;
            cursor: pointer;
        }

        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 35px;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            z-index: 9999;
        }

        .start-button {
            background: green;
            color: white;
            border: none;
            padding: 4px 12px;
            font-weight: bold;
            cursor: pointer;
        }

        #clock {
            color: white;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="desktop">
        <div class="desktop-imgs" onclick="openWindow('notes-win')">
            <img src="https://api.iconify.design/lucide:file-text.svg?color=white" alt="Notes">
            <span>Notes</span>
        </div>

        <div class="desktop-imgs" onclick="openWindow('wallpaper-win')">
            <img src="https://api.iconify.design/lucide:image.svg?color=white" alt="Settings">
            <span>Wallpaper</span>
        </div>

        <div class="desktop-imgs" onclick="openWindow('calc-win')">
            <img src="https://api.iconify.design/lucide:calculator.svg?color=white" alt="Calc">
            <span>Calculator</span>
        </div>
    </div>

    <div id="notes-win" class="win" style="top: 50px; left: 110px;">
        <div class="win-title">
            <span>Notes</span>
            <button class="close-btn" onclick="closeWindow('notes-win')">X</button>
        </div>
        <div class="win-body">
            <textarea id="note-text" placeholder="Type notes here..."></textarea>
            <div style="margin-top: 8px; display: flex; justify-content: space-between;">
                <button class="action-btn" onclick="clearNotes()">Clear</button>
                <button class="action-btn" onclick="alert('Saved!')">Save</button>
            </div>
        </div>
    </div>

    <div id="wallpaper-win" class="win" style="top: 80px; left: 160px;">
        <div class="win-title">
            <span>Wallpaper Settings</span>
            <button class="close-btn" onclick="closeWindow('wallpaper-win')">X</button>
        </div>
        <div class="win-body">
            <div class="settings-group">
                <label>Upload Image:</label>
                <input type="file" id="file-input" accept="image/*" onchange="changeWallpaperFile(event)">
            </div>

            <div class="settings-group">
                <label>Image Link:</label>
                <input type="text" id="url-input" placeholder="http://...">
                <button class="action-btn" onclick="changeWallpaperUrl()">Set Image</button>
            </div>

            <div class="settings-group">
                <label>Pick Color:</label>
                <div class="color-buttons">
                    <button class="color-btn" style="background: #2b3a4a;" onclick="changeWallpaperColor('#2b3a4a')"></button>
                    <button class="color-btn" style="background: purple;" onclick="changeWallpaperColor('purple')"></button>
                    <button class="color-btn" style="background: teal;" onclick="changeWallpaperColor('teal')"></button>
                    <button class="color-btn" style="background: brown;" onclick="changeWallpaperColor('brown')"></button>
                </div>
            </div>
        </div>
    </div>

    <div id="calc-win" class="win" style="top: 110px; left: 210px; width: 220px;">
        <div class="win-title">
            <span>Calculator</span>
            <button class="close-btn" onclick="closeWindow('calc-win')">X</button>
        </div>
        <div class="win-body">
            <input type="text" id="calc-screen" value="0" style="text-align: right; font-size: 16px;" readonly>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px;">
                <button class="action-btn" onclick="calcAppend('7')">7</button>
                <button class="action-btn" onclick="calcAppend('8')">8</button>
                <button class="action-btn" onclick="calcAppend('9')">9</button>
                <button class="action-btn" onclick="calcAppend('+')">+</button>
                <button class="action-btn" onclick="calcAppend('4')">4</button>
                <button class="action-btn" onclick="calcAppend('5')">5</button>
                <button class="action-btn" onclick="calcAppend('6')">6</button>
                <button class="action-btn" onclick="calcAppend('-')">-</button>
                <button class="action-btn" onclick="calcAppend('1')">1</button>
                <button class="action-btn" onclick="calcAppend('2')">2</button>
                <button class="action-btn" onclick="calcAppend('3')">3</button>
                <button class="action-btn" onclick="calcEqual()">=</button>
                <button class="action-btn" style="grid-column: span 4; background: red;" onclick="calcClear()">Clear</button>
            </div>
        </div>
    </div>

    <div id="taskbar">
        <button class="start-button" onclick="alert('LegendOS')">Start</button>
        <div id="clock">00:00:00</div>
    </div>

    <script>
        let highestZIndex = 10;

        function makeWindowDraggable(windowElement) {
            let header = windowElement.querySelector('.win-title');
            let mouseX = 0;
            let mouseY = 0;

            header.onmousedown = function(e) {
                if (e.target.classList.contains('close-btn')) return;

                highestZIndex = highestZIndex + 1;
                windowElement.style.zIndex = highestZIndex;

                mouseX = e.clientX;
                mouseY = e.clientY;

                document.onmousemove = function(e) {
                    let moveX = mouseX - e.clientX;
                    let moveY = mouseY - e.clientY;
                    
                    mouseX = e.clientX;
                    mouseY = e.clientY;

                    windowElement.style.top = (windowElement.offsetTop - moveY) + "px";
                    windowElement.style.left = (windowElement.offsetLeft - moveX) + "px";
                };

                document.onmouseup = function() {
                    document.onmousemove = null;
                    document.onmouseup = null;
                };
            };
        }

        let allWindows = document.querySelectorAll('.win');
        for (let i = 0; i < allWindows.length; i++) {
            makeWindowDraggable(allWindows[i]);
            
            allWindows[i].onmousedown = function() {
                highestZIndex = highestZIndex + 1;
                this.style.zIndex = highestZIndex;
            };
        }

        function openWindow(id) {
            let win = document.getElementById(id);
            win.style.display = 'flex';
            highestZIndex = highestZIndex + 1;
            win.style.zIndex = highestZIndex;
        }

        function closeWindow(id) {
            document.getElementById(id).style.display = 'none';
        }

        function changeWallpaperFile(event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    document.body.style.backgroundImage = "url('" + e.target.result + "')";
                };
                reader.readAsDataURL(file);
            }
        }

        function changeWallpaperUrl() {
            let url = document.getElementById('url-input').value;
            if (url !== "") {
                document.body.style.backgroundImage = "url('" + url + "')";
            }
        }

        function changeWallpaperColor(colorCode) {
            document.body.style.backgroundImage = 'none';
            document.body.style.backgroundColor = colorCode;
        }

        function clearNotes() {
            document.getElementById('note-text').value = '';
        }

        let calcVal = "0";

        function calcAppend(num) {
            if (calcVal === "0") {
                calcVal = num;
            } else {
                calcVal = calcVal + num;
            }
            document.getElementById('calc-screen').value = calcVal;
        }

        function calcClear() {
            calcVal = "0";
            document.getElementById('calc-screen').value = calcVal;
        }

        function calcEqual() {
            try {
                calcVal = String(eval(calcVal));
                document.getElementById('calc-screen').value = calcVal;
            } catch (e) {
                document.getElementById('calc-screen').value = "Error";
                calcVal = "0";
            }
        }

        function updateClock() {
            let time = new Date();
            document.getElementById('clock').textContent = time.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        openWindow('notes-win');
    </script>
</body> 
</html>
